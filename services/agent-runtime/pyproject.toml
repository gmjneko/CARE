[project]
name = "agent-runtime"
version = "0.0.1"
description = "[CARE] Collaborative Agent Runtime for Enterprises."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.10",
    "uvicorn>=0.34",
]

[project.scripts]
care-runtime = "agent_runtime.app:cli"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
